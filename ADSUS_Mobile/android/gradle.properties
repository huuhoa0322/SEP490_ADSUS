org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# Đã kiểm chứng thật (12/09): KHÔNG phải add_2_calendar như comment cũ ghi — thủ phạm thật là
# device_calendar 4.3.3 (bản pub.dev MỚI NHẤT, không có bản nào mới hơn), build.gradle kiểu cũ
# không tương thích AGP 9 (thiếu compileSdk, lỗi "different roots"). Ở lại AGP 8.x cho tới khi
# device_calendar ra bản mới — không phải add_2_calendar (package đó build ổn ở AGP 9).
android.builtInKotlin=false

# Disable Kotlin incremental compilation to fix cache corruption issues
kotlin.incremental=false
kotlin.version=2.4.0
