name: ADSUS CI Pipeline

on:
    pull_request:
        branches: [develop, master]
    push:
        branches: [develop]

jobs:
    backend-ci:
        name: "Backend API - Build & Test"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"

            - name: Restore
              run: dotnet restore ADSUS_BE/ADSUS_BE.csproj

            - name: Unit Tests
              run: dotnet test ADSUS_BE.UnitTests/ADSUS_BE.UnitTests.csproj --no-restore --logger trx

            - name: Integration Tests
              env:
                  ConnectionStrings__DefaultConnection: ${{ secrets.TEST_DB_CONNECTION_STRING }}
              run: dotnet test ADSUS_BE.IntegrationTests/ADSUS_BE.IntegrationTests.csproj --no-restore --logger trx

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: backend-test-results
                  path: "**/TestResults/**/*.trx"

    frontend-ci:
        name: "Frontend - Lint, Test & Build"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: adsus-fe
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: adsus-fe/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run test -- --run
            - run: npm run build

    ai-backend-ci:
        name: "AI Backend - Lint & Import Check"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ADSUS_AIBE/backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -r requirements.txt
            - run: python -m py_compile main.py geometry.py

    mobile-ci:
        name: "Mobile - Analyze & Test"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ADSUS_Mobile
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.27.x"
            - run: flutter pub get
            - run: flutter analyze
            - run: flutter test
            - run: flutter build apk --debug

    docker-build-check:
        name: "Docker - Confirm Images Still Build"
        runs-on: ubuntu-latest
        needs: [backend-ci, ai-backend-ci]
        steps:
            - uses: actions/checkout@v4
            - run: docker build -f ADSUS_BE/Dockerfile -t adsus-backend:ci .
            - run: docker build -t adsus-ai-backend:ci ADSUS_AIBE/backend
