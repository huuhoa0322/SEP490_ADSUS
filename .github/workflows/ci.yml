name: ADSUS CI Pipeline

on:
    pull_request:
        branches: [develop, master]
    push:
        branches: [develop]

jobs:
    backend-ci:
        name: "Backend API - Build & Test"
        runs-on: ubuntu-latest
        # checks: write - dorny/test-reporter creates a Check Run + Job Summary from the .trx
        # files below. Only needed on this job (least privilege), and only works for
        # same-repo PRs, not forked PRs (GITHUB_TOKEN there is read-only regardless).
        permissions:
            contents: read
            actions: read
            checks: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"

            - name: Restore
              run: |
                  dotnet restore ADSUS_BE/ADSUS_BE.csproj
                  dotnet restore ADSUS_BE.UnitTests/ADSUS_BE.UnitTests.csproj
                  dotnet restore ADSUS_BE.IntegrationTests/ADSUS_BE.IntegrationTests.csproj

            - name: Unit Tests
              run: dotnet test ADSUS_BE.UnitTests/ADSUS_BE.UnitTests.csproj --no-restore --logger trx

            - name: Integration Tests
              if: success() || failure()
              continue-on-error: true  # Integration tests are often flaky; report still generated
              env:
                  ConnectionStrings__DefaultConnection: ${{ secrets.TEST_DB_CONNECTION_STRING }}
                  # Not a real shared secret — every test mints and validates its own tokens
                  # against this same running instance (see TestAuthHelper.cs), nothing
                  # outside this CI run ever decodes them. Program.cs throws at startup if
                  # this is missing, which fails every WebApplicationFactory-based test at once.
                  JwtSettings__SecretKey: "ci-only-fake-jwt-signing-key-not-used-anywhere-else-1234567890"
                  JwtSettings__Issuer: "adsus-ci"
                  JwtSettings__Audience: "adsus-ci"
                  JwtSettings__ExpiryMinutes: "60"
              run: dotnet test ADSUS_BE.IntegrationTests/ADSUS_BE.IntegrationTests.csproj --no-restore --logger trx

            # Two separate report steps, not one combined one — dotnet test already writes each
            # project's .trx into that project's OWN TestResults/ folder, so scoping the path
            # per-project splits the Job Summary into a Unit block and an Integration block
            # with their own counts, instead of one merged "750 passed" number. if: always() so
            # a report still shows which tests failed, not just a silent job failure.
            - name: Publish Unit Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: "Backend Unit Test Report"
                  path: "ADSUS_BE.UnitTests/**/*.trx"
                  reporter: dotnet-trx
                  fail-on-empty: "false"

            - name: Publish Integration Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: "Backend Integration Test Report"
                  path: "ADSUS_BE.IntegrationTests/**/*.trx"
                  reporter: dotnet-trx
                  fail-on-empty: "false"

            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: backend-test-results
                  path: "**/TestResults/**/*.trx"

    frontend-ci:
        name: "Frontend - Lint, Test & Build"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: adsus-fe
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  # jsdom ^30's bundled undici needs a newer Node webidl implementation
                  # (webidl.util.markAsUncloneable) than Node 20 has — vitest's worker pool
                  # can't even load jsdom on Node 20, failing every test file except the one
                  # using @vitest-environment node. Node 22 loads jsdom fine but msw@2.15.0's
                  # Blob/Response handling (used by downloadCaseReport's tests) breaks on
                  # Node 22's undici with "object.stream is not a function" — confirmed fixed
                  # on Node 26 (user's local machine), no newer msw release available to fix
                  # it on 22 instead.
                  node-version: 26
                  cache: npm
                  cache-dependency-path: adsus-fe/package-lock.json
            - run: npm ci
            - run: npm run lint

            # Split by an existing, already-consistent directory convention (verified across
            # every test file, not assumed): hooks/ and api/ tests use real hooks + MSW to
            # mock only the HTTP boundary (integration-style); components/, lib/, store/ tests
            # mock the hook/dependency directly (unit-style). --exclude is documented as
            # "additional globs to exclude", so it adds to (not replaces) the base
            # vitest.config.ts excludes.
            - name: Unit Tests
              run: npm run test -- --run --exclude "**/hooks/**" --exclude "**/api/**"

            - name: Integration Tests
              if: success() || failure()
              # "hooks"/"api" alone would ALSO match src/test/lib/api-messages.test.ts (unit-
              # style, no MSW) — Vitest's positional filters are plain substring matches
              # against the full path, not path-segment-aware, and that filename happens to
              # contain "api". Slashes force a real directory segment match instead.
              run: npm run test -- --run "/hooks/" "/api/"

            - run: npm run build

    ai-backend-ci:
        name: "AI Backend - Lint & Import Check"
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ADSUS_AIBE/backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - run: pip install -r requirements.txt
            - run: python -m py_compile main.py geometry.py

    mobile-ci:
        name: "Mobile - Analyze & Test"
        runs-on: ubuntu-latest
        # checks: write - same reason as backend-ci above, for dorny/test-reporter.
        permissions:
            contents: read
            actions: read
            checks: write
        defaults:
            run:
                working-directory: ADSUS_Mobile
        steps:
            - uses: actions/checkout@v4
            - uses: subosito/flutter-action@v2
              with:
                  flutter-version: "3.47.x"

            # Create google-services.json from base64-encoded secret (never commit the real file)
            # Get the content from: cat google-services.json | base64 -w0
            - name: Create google-services.json
              env:
                  GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
              run: |
                  echo "$GOOGLE_SERVICES_BASE64" | base64 -d > android/app/google-services.json

            - run: flutter pub get
            - run: flutter analyze

            # Split like backend-ci/frontend-ci: test/widget/ holds the 2 files that actually
            # call testWidgets() (moved there for this split — confirmed by grepping every
            # file, not assumed); everything else under test/ is plain unit test() logic, no
            # widget pumped. --file-reporter writes JSON ALONGSIDE the normal human-readable
            # console reporter (unlike --reporter json, which would replace it entirely).
            - name: Unit Tests
              # auth_repository_test.dart moved under test/features/auth/data/repositories/
              # (P_MB9 review, 28/08/2026) — already covered by the test/features argument
              # below, no longer needs its own explicit path.
              run: flutter test test/dio_client_test.dart test/features --file-reporter="json:unit-test-results.json"

            - name: Widget Tests
              if: success() || failure()
              run: flutter test test/widget --file-reporter="json:widget-test-results.json"

            - name: Publish Unit Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: "Mobile Unit Test Report"
                  path: "ADSUS_Mobile/unit-test-results.json"
                  reporter: flutter-json
                  fail-on-empty: "false"

            - name: Publish Widget Test Report
              uses: dorny/test-reporter@v3
              if: always()
              with:
                  name: "Mobile Widget Test Report"
                  path: "ADSUS_Mobile/widget-test-results.json"
                  reporter: flutter-json
                  fail-on-empty: "false"

            - run: flutter build apk --debug

    docker-build-check:
        name: "Docker - Confirm Images Still Build"
        runs-on: ubuntu-latest
        permissions:
            contents: read
        needs: [backend-ci, ai-backend-ci]
        steps:
            - uses: actions/checkout@v4
            - run: docker build -f ADSUS_BE/Dockerfile -t api-adsus:ci .
            - run: docker build -t adsus-ai:ci ADSUS_AIBE/backend
